<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parquet → CanvasXpress</title>

  <link  href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" type="text/css">
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>

  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    #status { color: #555; margin: 10px 0; }
    #status.error { color: #b00020; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Charting a Parquet file via canvasxpress-connectors (DuckDB)</h2>
  <div id="status">Loading…</div>
  <canvas id="cx" width="900" height="500"></canvas>

  <script>
    var statusEl = document.getElementById("status");
    function setStatus(m, e) { statusEl.className = e ? "error" : ""; statusEl.textContent = m; }

    // The server read the Parquet file through ParquetSource and aggregated in DuckDB
    // (a grouped pushdown query). The browser only talks to this app's /api/data.
    var q = encodeURIComponent(JSON.stringify({
      groupBy: ["region"],
      measures: [{ fn: "sum", column: "amount", as: "total_amount" }, { fn: "count" }]
    }));
    fetch("/api/data?_q=" + q)
      .then(function (r) { return r.ok ? r.json() : r.text().then(function (t) { throw new Error(t); }); })
      .then(function (data) {
        new CanvasXpress("cx", data, {
          graphType: "Bar",
          title: "Revenue by region (aggregated in DuckDB from a Parquet file)",
          xAxisTitle: "Region",
          yAxis: ["total_amount"],
          colorBy: "region",
          graphOrientation: "vertical"
        });
        setStatus("Rendered ✓  (" + data.y.smps.length + " groups from the Parquet file)");
      })
      .catch(function (err) { setStatus(err.message, true); });
  </script>
</body>
</html>
